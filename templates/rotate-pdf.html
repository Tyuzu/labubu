{{define "rotate-pdf.html"}}
<section class="tool-page">
  <div class="tool-header">
    <p class="eyebrow">PDF Utility</p>
    <h1>Rotate PDF</h1>
    <p>Rotate your PDF pages by 90, 180, or 270 degrees to correct orientation.</p>
  </div>

  <div class="tool-card">
    <form class="image-tool" data-tool="rotate-pdf">
      <div class="field">
        <label for="rotate-pdf-file">Upload PDF</label>
        <input id="rotate-pdf-file" type="file" accept="application/pdf" />
      </div>

      <div class="field">
        <label for="rotate-pdf-angle">Rotation</label>
        <select id="rotate-pdf-angle">
          <option value="90">90°</option>
          <option value="180">180°</option>
          <option value="270">270°</option>
        </select>
      </div>

      <button type="submit">Rotate PDF</button>
    </form>

    <div class="result-block">
      <a class="download-link" href="#" hidden>Download rotated PDF</a>
    </div>
  </div>
</section>
{{end}}
