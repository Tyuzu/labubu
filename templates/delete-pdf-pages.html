{{define "delete-pdf-pages.html"}}
<section class="tool-page">
  <div class="tool-header">
    <p class="eyebrow">PDF Utility</p>
    <h1>Delete PDF Pages</h1>
    <p>Remove selected pages from a PDF so the final file stays concise and focused.</p>
  </div>

  <div class="tool-card">
    <form class="image-tool" data-tool="delete-pdf-pages">
      <div class="field">
        <label for="delete-pdf-file">Upload PDF</label>
        <input id="delete-pdf-file" type="file" accept="application/pdf" />
      </div>

      <div class="field">
        <label for="delete-page-range">Pages to remove</label>
        <input id="delete-page-range" type="text" value="2, 4-5" placeholder="Example: 1, 3-4" />
      </div>

      <button type="submit">Delete pages</button>
    </form>

    <div class="result-block">
      <a class="download-link" href="#" hidden>Download updated PDF</a>
    </div>
  </div>
</section>
{{end}}
