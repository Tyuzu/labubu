{{define "image-rotator.html"}}
<section class="tool-page">
  <div class="tool-header">
    <p class="eyebrow">Image Utility</p>
    <h1>Image Rotator</h1>
    <p>Rotate uploaded images to the right angle for portrait or landscape adjustments.</p>
  </div>

  <div class="tool-card">
    <form class="image-tool" data-tool="rotate">
      <div class="field">
        <label for="rotate-file">Upload image</label>
        <input id="rotate-file" type="file" accept="image/*" />
      </div>

      <div class="field">
        <label for="rotate-angle">Rotation angle</label>
        <input id="rotate-angle" type="number" min="-360" max="360" value="90" />
      </div>

      <button type="submit">Rotate image</button>
    </form>

    <div class="result-block">
      <img class="tool-preview" alt="Rotated preview" hidden />
      <a class="download-link" href="#" hidden>Download rotated image</a>
    </div>
  </div>
</section>
{{end}}
