{{define "image-compressor.html"}}
<section class="tool-page">
  <div class="tool-header">
    <p class="eyebrow">Image Utility</p>
    <h1>Image Compressor</h1>
    <p>Reduce file size without losing the overall visual quality of your image.</p>
  </div>

  <div class="tool-card">
    <form class="image-tool" data-tool="compress">
      <div class="field">
        <label for="compress-file">Upload image</label>
        <div class="file-dropzone" data-dropzone data-input="compress-file" tabindex="0" role="button" aria-label="Upload image">
          <input id="compress-file" type="file" accept="image/*" hidden />
          <div class="dropzone-content">
            <span class="dropzone-icon">⇪</span>
            <div class="dropzone-copy">
              <strong>Drag &amp; drop your image here</strong>
              <span>or browse</span>
            </div>
          </div>
          <small class="dropzone-filename">No file selected</small>
        </div>
      </div>

      <div class="field range-field">
        <label for="compress-quality">Compression quality</label>
        <div class="range-row">
          <input id="compress-quality" type="range" min="0.1" max="1" step="0.05" value="0.7" />
          <span data-quality-value>0.70</span>
        </div>
      </div>

      <button type="submit">Compress image</button>
    </form>

    <div class="result-block">
      <img class="tool-preview" alt="Compressed preview" hidden />
      <a class="download-link" href="#" hidden>Download compressed image</a>
    </div>
  </div>
</section>
{{end}}
