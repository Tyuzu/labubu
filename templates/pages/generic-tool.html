{{define "generic-tool.html"}}
<section class="tool-page">
  <div class="tool-header">
    <p class="eyebrow">Browser Utility</p>
    <h1>{{.Metadata.Title}}</h1>
    <p>{{.Metadata.Description}}</p>
  </div>
  {{template "adBanner" .}}
  <div class="tool-card">
    <div class="field">
      <label for="generic-tool-file">Choose a file</label>
      <input id="generic-tool-file" type="file" accept="image/*,video/*,.pdf,.txt,.csv,.json" />
    </div>
    <button class="ui-button" type="button" disabled>Processing support coming soon</button>
  </div>
</section>
{{end}}
