{{define "qr-code-scanner.html"}}
<section class="tool-page">
  <div class="tool-header">
    <p class="eyebrow">Scanner Utility</p>
    <h1>QR Code Scanner</h1>
    <p>Scan QR codes from a photo or directly from your device camera and read the embedded result instantly.</p>
  </div>

  <div class="tool-card">
    <form class="image-tool" data-tool="qr-code-scanner">
      <div class="field">
        <label for="qr-file">Upload QR code</label>
        <input id="qr-file" type="file" accept="image/*" capture="environment" />
      </div>

      <div class="field">
        <label>Scan from camera</label>
        <div class="field-row two-col">
          <button type="button" class="camera-toggle">Use camera</button>
          <button type="button" class="camera-scan" hidden>Scan QR</button>
        </div>
        <video id="qr-camera" autoplay playsinline muted hidden></video>
        <canvas id="qr-scan-canvas" hidden></canvas>
      </div>

      <button type="submit">Decode QR code</button>
    </form>

    <div class="result-block">
      <img class="tool-preview" alt="QR code preview" hidden />
      <textarea class="tool-output" rows="6" readonly hidden></textarea>
      <a class="download-link" href="#" hidden>Download result</a>
    </div>
  </div>
</section>
{{end}}
