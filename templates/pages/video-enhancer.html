{{define "video-enhancer.html"}}
<section class="tool-page">
  <div class="tool-header">
    <p class="eyebrow">Video Utility</p>
    <h1>Video Enhancer</h1>
    <p>Improve video quality, burn in subtitles, adjust playback speed, fade music, and convert export formats in one browser workflow.</p>
  </div>
    {{template "adBanner" .}}
  <div class="tool-card">
    <form class="image-tool" data-tool="video-enhancer">
      <div class="field">
        <label for="video-enhance-file">Upload video</label>
        <input id="video-enhance-file" type="file" accept="video/*" />
      </div>

      <div class="field">
        <label for="video-enhance-action">Enhancement action</label>
        <select id="video-enhance-action">
          <option value="enhance" selected>Enhance video</option>
          <option value="burn-subtitles">Burn subtitles</option>
          <option value="trim-audio">Trim audio</option>
          <option value="audio-fade">Fade background music</option>
          <option value="speed-control">Speed control</option>
          <option value="convert-format">Format conversion</option>
        </select>
      </div>

      <div class="field-row two-col">
        <div class="field">
          <label for="video-enhance-contrast">Contrast</label>
          <input id="video-enhance-contrast" type="number" min="0.8" max="2.5" step="0.1" value="1.2" />
        </div>
        <div class="field">
          <label for="video-enhance-brightness">Brightness</label>
          <input id="video-enhance-brightness" type="number" min="-0.5" max="0.5" step="0.05" value="0.05" />
        </div>
      </div>

      <div class="field-row two-col">
        <div class="field">
          <label for="video-enhance-saturation">Saturation</label>
          <input id="video-enhance-saturation" type="number" min="0.5" max="2.5" step="0.1" value="1.25" />
        </div>
        <div class="field">
          <label for="video-speed-rate">Speed</label>
          <input id="video-speed-rate" type="number" min="0.5" max="2.0" step="0.1" value="1" />
        </div>
      </div>

      <div class="field-row two-col">
        <div class="field">
          <label for="video-subtitle-text">Subtitle text</label>
          <input id="video-subtitle-text" type="text" value="Imigi" placeholder="Your subtitle text" />
        </div>
        <div class="field">
          <label for="video-enhance-output-format">Export format</label>
          <select id="video-enhance-output-format">
            <option value="mp4" selected>MP4</option>
            <option value="webm">WebM</option>
            <option value="mov">MOV</option>
          </select>
        </div>
      </div>

      <div class="field-row two-col">
        <div class="field">
          <label for="video-trim-start">Audio trim start (s)</label>
          <input id="video-trim-start" type="number" min="0" value="0" />
        </div>
        <div class="field">
          <label for="video-trim-end">Audio trim end (s)</label>
          <input id="video-trim-end" type="number" min="1" value="10" />
        </div>
      </div>

      <div class="field-row two-col">
        <div class="field">
          <label for="video-fade-in">Fade in (s)</label>
          <input id="video-fade-in" type="number" min="0" max="10" step="0.5" value="1.5" />
        </div>
        <div class="field">
          <label for="video-fade-out">Fade out (s)</label>
          <input id="video-fade-out" type="number" min="0" max="10" step="0.5" value="1.5" />
        </div>
      </div>

      <button type="submit">Apply enhancement</button>
    </form>

    <div class="result-block">
      <video class="tool-preview" controls muted playsinline hidden></video>
      <a class="download-link" href="#" hidden>Download enhanced video</a>
    </div>
  </div>
</section>
{{end}}
