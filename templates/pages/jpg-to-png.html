{{define "jpg-to-png.html"}}
<section class="tool-page">
  <div class="tool-header">
    <p class="eyebrow">Image Conversion</p>
    <h1>JPG to PNG</h1>
    <p>Convert JPG files to transparent-friendly PNG format in a few steps.</p>
  </div>
    {{template "adBanner" .}}
  <div class="tool-card">
    <form class="image-tool" data-tool="jpg-to-png">
      <div class="field">
        <label for="jpg-png-file">Upload JPG image</label>
        <input id="jpg-png-file" type="file" accept="image/jpeg,.jpg,.jpeg" />
      </div>

      <button type="submit">Convert to PNG</button>
    </form>

    <div class="result-block">
      <img class="tool-preview" alt="PNG preview" hidden />
      <a class="download-link" href="#" hidden>Download PNG version</a>
    </div>
  </div>
</section>
{{end}}
