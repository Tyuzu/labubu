{{define "adBanner"}}
<div class="adsense-wrap adsense-wrap--inline" aria-hidden="true">
    <div class="adsense-slot adsense-slot--desktop"
         style="display:block; width:min(100%, 728px); height:90px; min-height:90px; background:rgba(148,163,184,0.08); border:1px solid rgba(148,163,184,0.15); border-radius:14px; margin:0 auto 1rem;"></div>
</div>
{{end}}

{{define "adFooter"}}
<div class="adsense-wrap adsense-wrap--footer" aria-hidden="true">
    <div class="adsense-slot adsense-slot--mobile"
         style="display:block; width:min(100%, 728px); height:90px; min-height:90px; background:rgba(148,163,184,0.08); border:1px solid rgba(148,163,184,0.15); border-radius:14px; margin:0 auto 1rem;"></div>
</div>
{{end}}
