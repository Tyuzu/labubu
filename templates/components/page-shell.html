{{define "componentPageShell"}}
<section class="page-shell bg-slate-900/40 border border-slate-800/80 rounded-2xl p-6 md:p-8 flex flex-col gap-6 shadow-xl relative overflow-hidden" aria-labelledby="shell-title-{{.ID}}">
    
    <!-- Header Section -->
    <div class="page-shell__header flex flex-col gap-1.5">
        {{if .Eyebrow}}
        <p class="eyebrow text-xs font-semibold uppercase tracking-wider text-indigo-400">{{.Eyebrow}}</p>
        {{end}}
        <h2 id="shell-title-{{.ID}}" class="text-xl md:text-2xl font-semibold tracking-tight text-slate-100">{{.Title}}</h2>
    </div>

    <!-- Optional Description -->
    {{if .Description}}
    <p class="page-shell__description text-sm text-slate-400 leading-relaxed max-w-2xl">{{.Description}}</p>
    {{end}}

    <!-- Action Toolbar (Primary & Secondary Buttons) -->
    {{if .PrimaryAction}}
    <div class="page-shell__actions flex flex-wrap items-center gap-3 pt-2">
        {{template "uiButton" .PrimaryAction}}
        {{if .SecondaryAction}}
            {{template "uiButton" .SecondaryAction}}
        {{end}}
    </div>
    {{end}}

</section>
{{end}}
