{{define "adBanner"}}
<aside class="adsense-container adsense-container--inline" aria-label="Advertisement" role="region">
    <div class="adsense-slot adsense-slot--desktop" 
         style="display:flex; align-items:center; justify-content:center; width:min(100%, 728px); height:90px; background:var(--color-surface-subtle, rgba(148,163,184,0.06)); border:1px dashed var(--color-border, rgba(148,163,184,0.15)); border-radius:12px; margin:1.5rem auto; overflow:hidden;">
        <!-- Inject actual Google AdSense script or placeholder fallback here -->
        <span style="font-size:0.75rem; color:var(--color-text-muted, #94a3b8); letter-spacing:0.05em; text-transform:uppercase;">Sponsored</span>
    </div>
</aside>
{{end}}

{{define "adFooter"}}
<footer class="adsense-container adsense-container--footer" aria-label="Footer Advertisement" role="region">
    <div class="adsense-slot adsense-slot--responsive" 
         style="display:flex; align-items:center; justify-content:center; width:min(100%, 728px); height:90px; background:var(--color-surface-subtle, rgba(148,163,184,0.06)); border:1px dashed var(--color-border, rgba(148,163,184,0.15)); border-radius:12px; margin:2rem auto 1rem; overflow:hidden;">
        <span style="font-size:0.75rem; color:var(--color-text-muted, #94a3b8); letter-spacing:0.05em; text-transform:uppercase;">Advertisement</span>
    </div>
</footer>
{{end}}
