{{define "header"}}
<header class="top-header">
    <div class="header-branding">
        <a href="/" class="brand-link" aria-label="Imigi Home">
            <span class="user-badge" aria-hidden="true">I</span>
            <span class="brand-name">Imigi</span>
        </a>
    </div>

    <form class="header-search-wrap" role="search" action="/search" method="get" onSubmit="return false;">
        <div class="search-box">
            <span class="search-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </span>
            <input 
                id="global-tool-search" 
                name="q"
                type="search" 
                placeholder="Search tools, formats, categories..." 
                aria-label="Search tools, formats, and categories"
                autocomplete="off"
                role="combobox"
                aria-expanded="false"
                aria-autocomplete="list"
                aria-controls="global-tool-results"
            />
            <div class="search-results" id="global-tool-results" role="listbox" hidden></div>
        </div>
    </form>

    <div class="header-actions">
        <button 
            type="button" 
            class="preview-toggle" 
            id="preview-toggle" 
            aria-expanded="false" 
            aria-controls="lazy-preview-panel"
        >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="3" x2="12" y2="21"/></svg>
            <span>Preview</span>
        </button>

        <button 
            type="button" 
            class="theme-toggle" 
            id="theme-toggle" 
            aria-label="Toggle dark and light theme"
            title="Toggle theme"
        >
            <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
    </div>
</header>

<div class="lazy-preview-panel" id="lazy-preview-panel" hidden aria-hidden="true">
    <div class="preview-header">
        <div>
            <span class="eyebrow">Side-by-side comparison</span>
            <h2>Before &amp; After Preview</h2>
        </div>
        <button type="button" class="preview-close" id="preview-close" aria-label="Close preview panel">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
    </div>

    <div class="preview-grid">
        <figure class="preview-card preview-card--before">
            <figcaption>Original (Before)</figcaption>
            <div class="preview-visual preview-visual--before" aria-hidden="true"></div>
        </figure>
        <figure class="preview-card preview-card--after">
            <figcaption>Optimized (After)</figcaption>
            <div class="preview-visual preview-visual--after" aria-hidden="true"></div>
        </figure>
    </div>

    <div class="preview-meta">
        <span class="meta-title">Supported Live Operations</span>
        <ul class="meta-tags">
            <li>Crop</li>
            <li>Resize</li>
            <li>Color Filters</li>
            <li>Scan Cleanup</li>
        </ul>
    </div>
</div>
{{end}}
