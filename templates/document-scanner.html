{{define "document-scanner.html"}}
<section class="tool-page">
  <div class="tool-header">
    <p class="eyebrow">Document Utility</p>
    <h1>Document Scanner</h1>
    <p>Turn a photo of a sheet or document into a cleaner, higher-contrast scan with auto-cropping and grayscale enhancement.</p>
  </div>

  <div class="tool-card">
    <form class="image-tool" data-tool="document-scanner">
      <div class="field">
        <label for="scanner-file">Upload document photo</label>
        <input id="scanner-file" type="file" accept="image/*" />
      </div>

      <div class="field">
        <label for="scanner-threshold">Scan intensity</label>
        <input id="scanner-threshold" type="range" min="120" max="220" step="5" value="180" />
      </div>

      <div class="field-row two-col">
        <div class="field">
          <label for="scanner-padding">Padding</label>
          <input id="scanner-padding" type="number" min="0" max="120" value="18" />
        </div>
        <div class="field">
          <label for="scanner-contrast">Contrast boost</label>
          <input id="scanner-contrast" type="number" min="1" max="3" step="0.1" value="1.6" />
        </div>
      </div>

      <button type="submit">Scan document</button>
    </form>

    <div class="result-block">
      <img class="tool-preview" alt="Scanned document preview" hidden />
      <a class="download-link" href="#" hidden>Download scanned document</a>
    </div>
  </div>
</section>
{{end}}
