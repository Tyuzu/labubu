{{define "uiFileUpload"}}
<div class="ui-file-upload flex flex-col gap-2 {{if .Class}}{{.Class}}{{end}}">
    {{if .Label}}
    <label class="text-xs font-medium text-slate-300 tracking-wide" for="{{if .Id}}{{.Id}}{{else}}file-upload{{end}}">
        {{.Label}}
    </label>
    {{end}}
    
    <div 
        class="file-dropzone ui-file-upload__dropzone group relative bg-slate-900/40 hover:bg-slate-900/80 border-2 border-dashed border-slate-800 hover:border-indigo-500/80 rounded-2xl p-8 transition-all duration-200 flex flex-col items-center justify-center text-center cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
        data-dropzone 
        data-input="{{if .Id}}{{.Id}}{{else}}file-upload{{end}}" 
        tabindex="0" 
        role="button" 
        aria-label="{{if .AriaLabel}}{{.AriaLabel}}{{else}}{{if .Label}}{{.Label}}{{else}}Upload file{{end}}{{end}}"
    >
        <input 
            id="{{if .Id}}{{.Id}}{{else}}file-upload{{end}}" 
            type="file" 
            {{if .Name}}name="{{.Name}}"{{end}} 
            {{if .Accept}}accept="{{.Accept}}"{{else}}accept="image/*,video/*,.pdf"{{end}} 
            {{if .Capture}}capture="{{.Capture}}"{{end}} 
            {{if .Multiple}}multiple{{end}} 
            {{if .Required}}required{{end}} 
            class="sr-only absolute inset-0 w-full h-full opacity-0 cursor-pointer pointer-events-auto" 
        />
        
        <div class="dropzone-content flex flex-col items-center justify-center gap-3 pointer-events-none">
            <div class="w-12 h-12 rounded-xl bg-slate-800/90 group-hover:bg-indigo-500/15 border border-slate-700/60 group-hover:border-indigo-500/40 text-slate-400 group-hover:text-indigo-400 flex items-center justify-center text-xl transition-colors shadow-sm" aria-hidden="true">
                {{if .Icon}}{{.Icon}}{{else}}⇪{{end}}
            </div>
            
            <div class="dropzone-copy flex flex-col gap-1">
                <strong class="text-sm font-semibold text-slate-200 group-hover:text-white transition-colors">
                    {{if .Title}}{{.Title}}{{else}}Drag &amp; drop your file here{{end}}
                </strong>
                <span class="text-xs text-slate-400">
                    {{if .Hint}}{{.Hint}}{{else}}or click to browse from your device{{end}}
                </span>
            </div>
        </div>

        <small class="dropzone-filename mt-3 text-xs font-mono text-slate-500 group-hover:text-slate-400 transition-colors">
            {{if .Placeholder}}{{.Placeholder}}{{else}}No file selected{{end}}
        </small>
    </div>
</div>
{{end}}
